<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 260" width="320" height="260" role="img" aria-label="Pendulo fisico: varilla de longitud L que cuelga del pivote O con angulo theta respecto a la vertical; su centro de masa G esta a L/2, y la velocidad de G es perpendicular a la varilla">
  <defs>
    <marker id="flecha-gris" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
    <marker id="flecha-azul" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5fa8"/>
    </marker>
    <marker id="flecha-rojo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
    <marker id="flecha-verde" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e8b57"/>
    </marker>
    <marker id="flecha-tenue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666666"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="318" height="258" rx="12" fill="#f7f7f5" stroke="#d8d8d3" stroke-width="1"/>

  <!-- techo, pivote y vertical -->
  <line x1="110" y1="45" x2="190" y2="45" stroke="#333333" stroke-width="2"/>
  <path d="M 118 45 L 110 37 M 128 45 L 120 37 M 138 45 L 130 37 M 148 45 L 140 37 M 158 45 L 150 37 M 168 45 L 160 37 M 178 45 L 170 37 M 188 45 L 180 37" stroke="#333333" stroke-width="1"/>
  <line x1="150.0" y1="45.0" x2="150.0" y2="240.0" stroke="#333333" stroke-width="1" stroke-dasharray="5 4"/>

  <!-- varilla -->
  <line x1="150" y1="45" x2="240.0" y2="200.9" stroke="#8a8a85" stroke-width="7" stroke-linecap="round"/>

  <!-- angulo theta, mas alla de G -->
  <path d="M 150.0 170.0 A 125 125 0 0 0 212.5 153.3" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="180.7" y="184.3" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="17" fill="#c0392b" font-style="italic">θ</text>

  <!-- r_{G/O}, junto a la varilla -->
  <line x1="138.7" y1="51.5" x2="183.7" y2="129.4" stroke="#333333" stroke-width="1.8" marker-end="url(#flecha-gris)"/>
  <text x="110.5" y="88.0" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="17" fill="#333333" font-weight="bold">r</text>
  <text x="121.0" y="92.0" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="12" fill="#333333" font-style="italic">G/O</text>

  <!-- velocidad de G: perpendicular a la varilla -->
  <line x1="195.0" y1="122.9" x2="255.6" y2="87.9" stroke="#2e8b57" stroke-width="2.5" marker-end="url(#flecha-verde)"/>
  <text x="259.6" y="93.9" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="17" fill="#2e8b57" font-weight="bold">v</text>
  <text x="270.2" y="86.3" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="12" fill="#2e8b57" font-style="italic">G</text>

  <!-- puntos -->
  <circle cx="195.0" cy="122.9" r="5" fill="#333333"/>
  <text x="207.0" y="136.9" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="16" fill="#333333" font-style="italic">G</text>
  <text x="241.9" y="165.7" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="17" fill="#333333" font-style="italic">L</text>
  <circle cx="150.0" cy="45.0" r="7" fill="#f7f7f5" stroke="#333333" stroke-width="1.5"/>
  <circle cx="150.0" cy="45.0" r="2" fill="#333333"/>
  <text x="168.0" y="31.0" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="17" fill="#333333" font-weight="bold">ω</text>
  <text x="178.5" y="23.4" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="12" fill="#333333" font-style="italic">A</text>
  <text x="116.0" y="59.0" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="16" fill="#333333" font-style="italic">O</text>

  <!-- marco A (gira con la varilla) -->
  <line x1="58.0" y1="210.0" x2="90.9" y2="191.0" stroke="#1f5fa8" stroke-width="2" marker-end="url(#flecha-azul)"/>
  <line x1="58.0" y1="210.0" x2="39.0" y2="177.1" stroke="#1f5fa8" stroke-width="2" marker-end="url(#flecha-azul)"/>
  <text x="94.9" y="195.0" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="17" fill="#1f5fa8" font-weight="bold">a</text>
  <text x="104.9" y="199.0" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="12" fill="#1f5fa8" font-style="italic">x</text>
  <path d="M 96.5 184.0 L 99.7 181.0 L 102.9 184.0" fill="none" stroke="#1f5fa8" stroke-width="1.3"/>
  <text x="11.0" y="179.1" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="17" fill="#1f5fa8" font-weight="bold">a</text>
  <text x="21.0" y="183.1" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="12" fill="#1f5fa8" font-style="italic">y</text>
  <path d="M 12.6 168.1 L 15.8 165.1 L 19.0 168.1" fill="none" stroke="#1f5fa8" stroke-width="1.3"/>
  <text x="28.0" y="240.0" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="12" fill="#1f5fa8">marco <tspan font-style='italic'>A</tspan></text>
</svg>
