<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240" role="img" aria-label="El unitario b_x del marco B en dos instantes: visto desde N gira un angulo q punto dt y cambia en d b_x, perpendicular a si mismo; visto desde B no cambia">
  <defs>
    <marker id="flecha-gris" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
    <marker id="flecha-azul" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5fa8"/>
    </marker>
    <marker id="flecha-rojo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
    <marker id="flecha-verde" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e8b57"/>
    </marker>
    <marker id="flecha-tenue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666666"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="318" height="238" rx="12" fill="#f7f7f5" stroke="#d8d8d3" stroke-width="1"/>

  <!-- marco N -->
  <line x1="110.0" y1="185.0" x2="290.0" y2="185.0" stroke="#333333" stroke-width="1.5" marker-end="url(#flecha-gris)"/>
  <line x1="110.0" y1="185.0" x2="110.0" y2="25.0" stroke="#333333" stroke-width="1.5" marker-end="url(#flecha-gris)"/>
  <text x="280.0" y="207.0" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="17" fill="#333333" font-weight="bold">n</text>
  <text x="290.0" y="211.0" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="12" fill="#333333" font-style="italic">x</text>
  <path d="M 281.6 196.0 L 284.8 193.0 L 288.0 196.0" fill="none" stroke="#333333" stroke-width="1.3"/>
  <text x="78.0" y="36.0" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="17" fill="#333333" font-weight="bold">n</text>
  <text x="88.0" y="40.0" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="12" fill="#333333" font-style="italic">y</text>
  <path d="M 79.6 25.0 L 82.8 22.0 L 86.0 25.0" fill="none" stroke="#333333" stroke-width="1.3"/>

  <!-- b_x en t (fuerte) y en t + dt (tenue) -->
  <line x1="110.0" y1="185.0" x2="236.9" y2="125.8" stroke="#1f5fa8" stroke-width="2.5" marker-end="url(#flecha-azul)"/>
  <line x1="110.0" y1="185.0" x2="200.0" y2="77.8" stroke="#1f5fa8" stroke-width="2.5" opacity="0.4" marker-end="url(#flecha-azul)"/>
  <text x="242.9" y="137.8" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="17" fill="#1f5fa8" font-weight="bold">b</text>
  <text x="252.9" y="141.8" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="12" fill="#1f5fa8" font-style="italic">x</text>
  <path d="M 244.4 123.1 L 247.6 120.1 L 250.8 123.1" fill="none" stroke="#1f5fa8" stroke-width="1.3"/>
  <text x="262.9" y="141.8" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="14" fill="#1f5fa8" font-style="italic">(t)</text>
  <text x="186.0" y="69.8" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="17" fill="#1f5fa8" font-weight="bold">b</text>
  <text x="196.0" y="73.8" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="12" fill="#1f5fa8" font-style="italic">x</text>
  <path d="M 187.6 55.0 L 190.8 52.0 L 194.0 55.0" fill="none" stroke="#1f5fa8" stroke-width="1.3"/>
  <text x="206.0" y="65.8" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="14" fill="#1f5fa8" font-style="italic">(t + dt)</text>

  <!-- angulo barrido en dt -->
  <path d="M 173.4 155.4 A 70 70 0 0 0 155.0 131.4" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="177.5" y="141.3" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="16" fill="#c0392b" font-style="italic">q dt</text>
  <circle cx="182.7" cy="131.4" r="1.4" fill="#c0392b"/>

  <!-- cambio de b_x: perpendicular a b_x -->
  <line x1="236.9" y1="125.8" x2="203.0" y2="82.8" stroke="#2e8b57" stroke-width="2" marker-end="url(#flecha-verde)"/>
  <text x="238.9" y="95.8" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="16" fill="#2e8b57" font-style="italic">d</text>
  <text x="248.9" y="95.8" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="16" fill="#2e8b57" font-weight="bold">b</text>
  <text x="258.3" y="99.8" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="12" fill="#2e8b57" font-style="italic">x</text>
  <path d="M 250.2 81.8 L 253.4 78.8 L 256.6 81.8" fill="none" stroke="#2e8b57" stroke-width="1.3"/>

  <!-- omega de B en N, saliendo de la pagina -->
  <circle cx="110.0" cy="185.0" r="7" fill="#f7f7f5" stroke="#333333" stroke-width="1.5"/>
  <circle cx="110.0" cy="185.0" r="2" fill="#333333"/>
  <text x="62.4" y="183.3" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="12" fill="#333333" font-style="italic">N</text>
  <text x="70.0" y="191.0" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="17" fill="#333333" font-weight="bold">ω</text>
  <text x="80.5" y="183.3" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="12" fill="#333333" font-style="italic">B</text>

  <!-- lectura -->
  <text x="302.0" y="34.0" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="13" fill="#333333" text-anchor="end">desde <tspan font-style='italic'>B</tspan>: no cambia</text>
  <text x="302.0" y="52.0" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="13" fill="#333333" text-anchor="end">desde <tspan font-style='italic'>N</tspan>: gira</text>
</svg>
