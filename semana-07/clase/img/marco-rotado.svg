<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240" role="img" aria-label="Marco B obtenido al girar el marco N un angulo q alrededor del eje z, que sale de la pagina">
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
    <marker id="flecha-vector" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5fa8"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="318" height="238" rx="12" fill="#f7f7f5" stroke="#d8d8d3" stroke-width="1"/>

  <!-- marco N: ejes del laboratorio -->
  <line x1="130" y1="190" x2="285" y2="190" stroke="#333333" stroke-width="1.5" marker-end="url(#flecha)"/>
  <line x1="130" y1="190" x2="130" y2="30" stroke="#333333" stroke-width="1.5" marker-end="url(#flecha)"/>
  <text x="289" y="195" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="17" font-weight="bold" fill="#333333">n</text>
  <text x="299.0" y="199" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="12" font-style="italic" fill="#333333">x</text>
  <path d="M 290.6 184.0 L 293.8 181.0 L 297.0 184.0" fill="none" stroke="#333333" stroke-width="1.3"/>
  <text x="120" y="24" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="17" font-weight="bold" fill="#333333">n</text>
  <text x="130.0" y="28" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="12" font-style="italic" fill="#333333">y</text>
  <path d="M 121.6 13.0 L 124.8 10.0 L 128.0 13.0" fill="none" stroke="#333333" stroke-width="1.3"/>

  <!-- marco B: N girado q = 30 grados alrededor de z -->
  <line x1="130" y1="190" x2="251" y2="120" stroke="#1f5fa8" stroke-width="2.5" marker-end="url(#flecha-vector)"/>
  <line x1="130" y1="190" x2="60" y2="69" stroke="#1f5fa8" stroke-width="2.5" marker-end="url(#flecha-vector)"/>
  <text x="256" y="116" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="17" font-weight="bold" fill="#1f5fa8">b</text>
  <text x="266.0" y="120" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="12" font-style="italic" fill="#1f5fa8">x</text>
  <path d="M 257.6 101.3 L 260.8 98.3 L 264.0 101.3" fill="none" stroke="#1f5fa8" stroke-width="1.3"/>
  <text x="40" y="62" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="17" font-weight="bold" fill="#1f5fa8">b</text>
  <text x="50.0" y="66" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="12" font-style="italic" fill="#1f5fa8">y</text>
  <path d="M 41.6 47.3 L 44.8 44.3 L 48.0 47.3" fill="none" stroke="#1f5fa8" stroke-width="1.3"/>

  <!-- el mismo angulo q entre n_x y b_x, y entre n_y y b_y -->
  <path d="M 190 190 A 60 60 0 0 0 182 160" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="195" y="176" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="17" fill="#c0392b" font-style="italic">q</text>
  <path d="M 130 130 A 60 60 0 0 0 100 138" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="108" y="124" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="17" fill="#c0392b" font-style="italic">q</text>

  <!-- eje z comun, saliendo de la pagina -->
  <circle cx="130" cy="190" r="7" fill="#f7f7f5" stroke="#333333" stroke-width="1.5"/>
  <circle cx="130" cy="190" r="2" fill="#333333"/>
  <text x="84" y="217" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="15" font-weight="bold" fill="#666666">n</text>
  <text x="92.9" y="221" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="11" font-style="italic" fill="#666666">z</text>
  <path d="M 85.0 207.0 L 88.2 204.0 L 91.4 207.0" fill="none" stroke="#666666" stroke-width="1.3"/>
  <text x="104.5" y="217" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="15" fill="#666666">=</text>
  <text x="120" y="217" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="15" font-weight="bold" fill="#666666">b</text>
  <text x="128.9" y="221" font-family="'Latin Modern Roman', 'CMU Serif', 'Times New Roman', serif" font-size="11" font-style="italic" fill="#666666">z</text>
  <path d="M 121.0 203.7 L 124.2 200.7 L 127.4 203.7" fill="none" stroke="#666666" stroke-width="1.3"/>

  <!-- identidad -->
  <text x="228" y="232" font-family="monospace" font-size="12" fill="#333333" text-anchor="middle">B.orient_axis(N, N.z, q)</text>
</svg>
